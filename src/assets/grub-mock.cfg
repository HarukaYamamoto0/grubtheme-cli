### BEGIN /etc/grub.d/30_uefi-firmware (mock) ###
# In your i386-pc QEMU VM this entry does not appear, as in the original.
if [ "$grub_platform" = "efi" ]; then
    menuentry 'UEFI Firmware Settings' --class efi {
        echo 'Preview only: firmware setup is not launched.'
        sleep --interruptible 3
    }
fi
### END /etc/grub.d/30_uefi-firmware ###

### BEGIN /etc/grub.d/40_custom ###
menuentry 'Ventoy' {
    echo 'Preview only: no Ventoy partition exists in this image.'
    sleep --interruptible 3
}

menuentry 'System shutdown' --class shutdown {
    halt
}

menuentry 'System reboot' --class restart {
    reboot
}
### END /etc/grub.d/40_custom ###

### BEGIN /etc/grub.d/41_custom ###
# Optional custom entries from /boot/grub/custom.cfg.
if [ -f $prefix/custom.cfg ]; then
    source $prefix/custom.cfg
fi
### END /etc/grub.d/41_custom ###
