# GRUB2 mock configuration for grubtheme-cli preview.
# Based on the supplied Linux Mint grub.cfg, but does not boot an OS.
# Install as /boot/grub/grub.cfg in the RAW image (BIOS / i386-pc).
# Every Linux/Windows/Ventoy entry is a visual mock. Shutdown/reboot are real.

### BEGIN /etc/grub.d/00_header (mock) ###

# grub-install creates an MBR image with the GRUB files on partition 1.
insmod part_msdos
insmod ext2
set root=(hd0,msdos1)

set default=0
set timeout_style=menu
set timeout=10
# For an interactive preview without automatic selection, use: set timeout=-1

# The requested resolution must be supported by the QEMU video adapter.
set gfxmode=1920x1080,auto
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
insmod jpeg

# Load the standard GRUB font if provided with the disk image.
# Using `loadfont unicode` as a fallback also supports GRUB setups with
# a bundled/default font. Without a font, keep the text console usable.
if loadfont $prefix/fonts/unicode.pf2; then
    terminal_output gfxterm
elif loadfont unicode; then
    terminal_output gfxterm
else
    terminal_output console
fi

# Optional fonts originally present in the user's GRUB configuration.
# Their .pf2 files must exist in the copied theme directory.
if [ -f $prefix/themes/current-theme/heiti-32.pf2 ]; then
    loadfont $prefix/themes/current-theme/heiti-32.pf2
fi
if [ -f $prefix/themes/current-theme/xiangsu-32.pf2 ]; then
    loadfont $prefix/themes/current-theme/xiangsu-32.pf2
fi

if [ -f $prefix/themes/current-theme/theme.txt ]; then
    set theme=$prefix/themes/current-theme/theme.txt
    export theme
fi

### END /etc/grub.d/00_header ###

### BEGIN /etc/grub.d/05_debian_theme ###
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray
### END /etc/grub.d/05_debian_theme ###

